<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Sales Activity Dashboard</title>

<style>
:root {
  --navy:#14213d;
  --blue:#2563eb;
  --light:#f4f7fb;
  --text:#172033;
  --muted:#6b7280;
  --green:#159957;
  --orange:#f59e0b;
  --red:#dc2626;
  --border:#e5e7eb;
  --white:#fff;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--light);
  color:var(--text);
}

header {
  background:var(--navy);
  color:white;
  padding:20px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1 {
  margin:0;
  font-size:23px;
}

header small {
  color:#cbd5e1;
}

.app {
  display:flex;
  min-height:calc(100vh - 78px);
}

.sidebar {
  width:220px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:18px 12px;
}

.sidebar button {
  width:100%;
  text-align:left;
  padding:12px 14px;
  margin-bottom:6px;
  border:0;
  border-radius:7px;
  background:white;
  color:var(--text);
  cursor:pointer;
  font-size:14px;
}

.sidebar button:hover,
.sidebar button.active {
  background:#e8efff;
  color:var(--blue);
  font-weight:bold;
}

main {
  flex:1;
  padding:25px;
  overflow:auto;
}

.page { display:none; }
.page.active { display:block; }

.toolbar {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:18px 0;
}

button,
select,
input,
textarea {
  font:inherit;
}

.primary,
.secondary,
.danger {
  border:0;
  border-radius:6px;
  padding:10px 14px;
  cursor:pointer;
}

.primary {
  background:var(--blue);
  color:white;
}

.secondary {
  background:#e5e7eb;
  color:var(--text);
}

.danger {
  background:#fee2e2;
  color:var(--red);
}

select,
input,
textarea {
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:6px;
  background:white;
}

.filters {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.card-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(175px,1fr));
  gap:15px;
  margin:18px 0;
}

.card {
  background:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:18px;
  box-shadow:0 2px 5px rgba(0,0,0,.04);
}

.card .label {
  color:var(--muted);
  font-size:13px;
}

.card .value {
  font-size:26px;
  font-weight:bold;
  margin-top:8px;
}

.layout {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
  gap:18px;
}

.panel {
  background:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:18px;
  margin-bottom:18px;
}

.panel h3 {
  margin-top:0;
  font-size:16px;
}

table {
  border-collapse:collapse;
  width:100%;
  background:white;
}

th,
td {
  padding:11px 10px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:13px;
  vertical-align:top;
}

th {
  background:#f8fafc;
  color:#4b5563;
  white-space:nowrap;
}

.badge {
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.badge.green { background:#dcfce7; color:#166534; }
.badge.blue { background:#dbeafe; color:#1d4ed8; }
.badge.orange { background:#fef3c7; color:#92400e; }
.badge.red { background:#fee2e2; color:#991b1b; }
.badge.gray { background:#f3f4f6; color:#4b5563; }

.bar-row {
  display:grid;
  grid-template-columns:125px 1fr 85px;
  gap:8px;
  align-items:center;
  margin:13px 0;
  font-size:13px;
}

.bar {
  height:13px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
}

.bar span {
  display:block;
  height:100%;
  background:var(--blue);
  border-radius:20px;
}

.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  align-items:center;
  justify-content:center;
  z-index:10;
}

.modal.show { display:flex; }

.modal-box {
  background:white;
  width:min(620px,94vw);
  max-height:90vh;
  overflow:auto;
  border-radius:10px;
  padding:22px;
}

.form-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.form-grid .full { grid-column:1 / -1; }

.form-grid label {
  display:flex;
  flex-direction:column;
  gap:6px;
  font-size:13px;
  color:#4b5563;
}

.modal-actions {
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:20px;
}

@media(max-width:760px) {
  .sidebar { width:65px; }
  .sidebar button { font-size:0; text-align:center; }
  .sidebar button::first-letter { font-size:20px; }
  main { padding:15px; }
  .form-grid { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<header>
  <div>
    <h1>Pre-Sales Activity Dashboard</h1>
    <small>Sales activity tracking and reporting tool</small>
  </div>
  <div id="today"></div>
</header>

<div class="app">

<aside class="sidebar">
  <button class="active" onclick="showPage('dashboard',this)">📊 Dashboard</button>
  <button onclick="showPage('opportunities',this)">💼 Opportunities</button>
  <button onclick="showPage('activities',this)">📅 Activities</button>
  <button onclick="showPage('accounts',this)">🏢 Accounts</button>
  <button onclick="exportAll()">⬇ Export CSV</button>
  <button onclick="resetData()">↻ Reset Data</button>
</aside>

<main>

<section id="dashboard" class="page active">
  <h2>Dashboard</h2>

  <div class="toolbar filters">
    <select id="dashboardRep" onchange="renderDashboard()">
      <option value="">All representatives</option>
    </select>

    <select id="dashboardRegion" onchange="renderDashboard()">
      <option value="">All regions</option>
    </select>

    <select id="dashboardStage" onchange="renderDashboard()">
      <option value="">All stages</option>
      <option>Lead</option>
      <option>Qualified</option>
      <option>Discovery</option>
      <option>Demo</option>
      <option>Proposal</option>
      <option>Closed Won</option>
      <option>Closed Lost</option>
    </select>
  </div>

  <div class="card-grid">
    <div class="card"><div class="label">New Leads</div><div class="value" id="kpiLeads">0</div></div>
    <div class="card"><div class="label">Qualified Opportunities</div><div class="value" id="kpiQualified">0</div></div>
    <div class="card"><div class="label">Open Pipeline</div><div class="value" id="kpiPipeline">$0</div></div>
    <div class="card"><div class="label">Closed Won</div><div class="value" id="kpiWon">$0</div></div>
    <div class="card"><div class="label">Win Rate</div><div class="value" id="kpiWinRate">0%</div></div>
    <div class="card"><div class="label">Total Activities</div><div class="value" id="kpiActivities">0</div></div>
  </div>

  <div class="layout">
    <div class="panel">
      <h3>Pipeline by Stage</h3>
      <div id="stageChart"></div>
    </div>

    <div class="panel">
      <h3>Pipeline by Representative</h3>
      <div id="repChart"></div>
    </div>
  </div>

  <div class="panel">
    <h3>Recent Activities</h3>
    <div id="recentActivities"></div>
  </div>
</section>

<section id="opportunities" class="page">
  <h2>Opportunities</h2>

  <div class="toolbar">
    <button class="primary" onclick="openOpportunityModal()">+ Add Opportunity</button>
    <input id="opportunitySearch" placeholder="Search opportunities..." oninput="renderOpportunities()">
  </div>

  <div class="panel">
    <div id="opportunityTable"></div>
  </div>
</section>

<section id="activities" class="page">
  <h2>Activities</h2>

  <div class="toolbar">
    <button class="primary" onclick="openActivityModal()">+ Add Activity</button>
    <input id="activitySearch" placeholder="Search activities..." oninput="renderActivities()">
  </div>

  <div class="panel">
    <div id="activityTable"></div>
  </div>
</section>

<section id="accounts" class="page">
  <h2>Accounts</h2>

  <div class="panel">
    <div id="accountTable"></div>
  </div>
</section>

</main>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <form id="modalForm"></form>
  </div>
</div>

<script>
const STORAGE_KEY = "presales_tracking_data_v1";

const sampleData = {
  opportunities: [
    {id:1, name:"Northstar Health Analytics", account:"Northstar Health", rep:"Aisha Khan", region:"North", stage:"Proposal", value:125000, probability:75, created:"2026-01-08", qualified:"2026-01-15", close:"2026-03-30"},
    {id:2, name:"Acme Clinical Portal", account:"Acme Medical Group", rep:"Daniel Reed", region:"West", stage:"Demo", value:85000, probability:55, created:"2026-01-12", qualified:"2026-01-20", close:"2026-04-15"},
    {id:3, name:"Summit Data Platform", account:"Summit Care", rep:"Maria Lopez", region:"South", stage:"Qualified", value:160000, probability:35, created:"2026-02-02", qualified:"2026-02-11", close:"2026-05-20"},
    {id:4, name:"BrightPath Integration", account:"BrightPath Labs", rep:"Aisha Khan", region:"East", stage:"Lead", value:45000, probability:10, created:"2026-02-15", qualified:"", close:"2026-06-01"},
    {id:5, name:"Evergreen Enterprise Rollout", account:"Evergreen Health", rep:"Daniel Reed", region:"North", stage:"Closed Won", value:210000, probability:100, created:"2025-12-05", qualified:"2025-12-18", close:"2026-02-28"},
    {id:6, name:"Riverbend Workflow", account:"Riverbend Clinic", rep:"Maria Lopez", region:"West", stage:"Closed Lost", value:70000, probability:0, created:"2025-12-18", qualified:"2025-12-29", close:"2026-02-20"}
  ],

  activities: [
    {id:1, date:"2026-03-01", type:"Discovery Call", subject:"Requirements discussion", account:"Northstar Health", rep:"Aisha Khan", outcome:"Positive"},
    {id:2, date:"2026-03-02", type:"Demo", subject:"Product demonstration", account:"Acme Medical Group", rep:"Daniel Reed", outcome:"Follow-up required"},
    {id:3, date:"2026-03-03", type:"Email", subject:"Proposal follow-up", account:"Summit Care", rep:"Maria Lopez", outcome:"Awaiting response"},
    {id:4, date:"2026-03-04", type:"Meeting", subject:"Executive alignment", account:"Evergreen Health", rep:"Daniel Reed", outcome:"Completed"},
    {id:5, date:"2026-03-05", type:"Call", subject:"Initial qualification", account:"BrightPath Labs", rep:"Aisha Khan", outcome:"Positive"}
  ],

  accounts: [
    {id:1, name:"Northstar Health", region:"North", specialty:"Healthcare", owner:"Aisha Khan", priority:"High", status:"Active"},
    {id:2, name:"Acme Medical Group", region:"West", specialty:"Healthcare", owner:"Daniel Reed", priority:"High", status:"Active"},
    {id:3, name:"Summit Care", region:"South", specialty:"Healthcare", owner:"Maria Lopez", priority:"Medium", status:"Active"},
    {id:4, name:"BrightPath Labs", region:"East", specialty:"Technology", owner:"Aisha Khan", priority:"Medium", status:"Prospect"},
    {id:5, name:"Evergreen Health", region:"North", specialty:"Healthcare", owner:"Daniel Reed", priority:"High", status:"Customer"},
    {id:6, name:"Riverbend Clinic", region:"West", specialty:"Healthcare", owner:"Maria Lopez", priority:"Low", status:"Inactive"}
  ]
};

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || sampleData;

document.getElementById("today").textContent =
  new Date().toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function money(value) {
  return new Intl.NumberFormat("en-US", {
    style:"currency",
    currency:"USD",
    maximumFractionDigits:0
  }).format(value || 0);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function badge(value) {
  const v = String(value).toLowerCase();
  let cls = "gray";
  if (["closed won","positive","customer","high","completed"].includes(v)) cls="green";
  else if (["qualified","demo","active","medium"].includes(v)) cls="blue";
  else if (["proposal","discovery call","follow-up required","prospect"].includes(v)) cls="orange";
  else if (["closed lost","inactive","low"].includes(v)) cls="red";
  return `<span class="badge ${cls}">${esc(value)}</span>`;
}

function showPage(id, button) {
  document.querySelectorAll(".page").forEach(x => x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".sidebar button").forEach(x => x.classList.remove("active"));
  if (button) button.classList.add("active");

  if (id === "dashboard") renderDashboard();
  if (id === "opportunities") renderOpportunities();
  if (id === "activities") renderActivities();
  if (id === "accounts") renderAccounts();
}

function setupFilters() {
  const reps = [...new Set(data.opportunities.map(x=>x.rep))].sort();
  const regions = [...new Set(data.opportunities.map(x=>x.region))].sort();

  document.getElementById("dashboardRep").innerHTML =
    `<option value="">All representatives</option>` +
    reps.map(x=>`<option>${esc(x)}</option>`).join("");

  document.getElementById("dashboardRegion").innerHTML =
    `<option value="">All regions</option>` +
    regions.map(x=>`<option>${esc(x)}</option>`).join("");
}

function filteredOpportunities() {
  const rep = document.getElementById("dashboardRep").value;
  const region = document.getElementById("dashboardRegion").value;
  const stage = document.getElementById("dashboardStage").value;

  return data.opportunities.filter(o =>
    (!rep || o.rep === rep) &&
    (!region || o.region === region) &&
    (!stage || o.stage === stage)
  );
}

function renderDashboard() {
  setupFilters();

  const opps = filteredOpportunities();
  const open = opps.filter(o => !["Closed Won","Closed Lost"].includes(o.stage));
  const won = opps.filter(o => o.stage === "Closed Won");
  const lost = opps.filter(o => o.stage === "Closed Lost");
  const closed = won.length + lost.length;

  document.getElementById("kpiLeads").textContent =
    opps.filter(o=>o.stage==="Lead").length;

  document.getElementById("kpiQualified").textContent =
    opps.filter(o=>["Qualified","Discovery","Demo","Proposal"].includes(o.stage)).length;

  document.getElementById("kpiPipeline").textContent =
    money(open.reduce((a,o)=>a+Number(o.value),0));

  document.getElementById("kpiWon").textContent =
    money(won.reduce((a,o)=>a+Number(o.value),0));

  document.getElementById("kpiWinRate").textContent =
    closed ? Math.round(won.length / closed * 100) + "%" : "0%";

  document.getElementById("kpiActivities").textContent =
    data.activities.length;

  renderStageChart(opps);
  renderRepChart(open);
  renderRecentActivities();
}

function renderStageChart(opps) {
  const stages = ["Lead","Qualified","Discovery","Demo","Proposal","Closed Won","Closed Lost"];
  const values = stages.map(stage =>
    opps.filter(o=>o.stage===stage).reduce((a,o)=>a+Number(o.value),0)
  );
  const max = Math.max(...values,1);

  document.getElementById("stageChart").innerHTML = stages.map((stage,i)=>`
    <div class="bar-row">
      <div>${stage}</div>
      <div class="bar"><span style="width:${values[i]/max*100}%"></span></div>
      <div>${money(values[i])}</div>
    </div>
  `).join("");
}

function renderRepChart(opps) {
  const reps = [...new Set(opps.map(o=>o.rep))];
  const values = reps.map(rep =>
    opps.filter(o=>o.rep===rep).reduce((a,o)=>a+Number(o.value),0)
  );
  const max = Math.max(...values,1);

  document.getElementById("repChart").innerHTML = reps.length ? reps.map((rep,i)=>`
    <div class="bar-row">
      <div>${esc(rep)}</div>
      <div class="bar"><span style="width:${values[i]/max*100}%"></span></div>
      <div>${money(values[i])}</div>
    </div>
  `).join("") : "<p>No matching opportunities.</p>";
}

function renderRecentActivities() {
  const rows = [...data.activities]
    .sort((a,b)=>b.date.localeCompare(a.date))
    .slice(0,8);

  document.getElementById("recentActivities").innerHTML = `
    <table>
      <tr><th>Date</th><th>Type</th><th>Subject</th><th>Account</th><th>Rep</th><th>Outcome</th></tr>
      ${rows.map(a=>`
      <tr>
        <td>${esc(a.date)}</td>
        <td>${badge(a.type)}</td>
        <td>${esc(a.subject)}</td>
        <td>${esc(a.account)}</td>
        <td>${esc(a.rep)}</td>
        <td>${badge(a.outcome)}</td>
      </tr>`).join("")}
    </table>`;
}

function renderOpportunities() {
  const query = (document.getElementById("opportunitySearch")?.value || "").toLowerCase();

  const rows = data.opportunities.filter(o =>
    Object.values(o).join(" ").toLowerCase().includes(query)
  );

  document.getElementById("opportunityTable").innerHTML = `
    <table>
      <tr>
        <th>Opportunity</th><th>Account</th><th>Rep</th><th>Region</th>
        <th>Stage</th><th>Value</th><th>Probability</th><th>Close Date</th><th></th>
      </tr>
      ${rows.map(o=>`
      <tr>
        <td><strong>${esc(o.name)}</strong></td>
        <td>${esc(o.account)}</td>
        <td>${esc(o.rep)}</td>
        <td>${esc(o.region)}</td>
        <td>${badge(o.stage)}</td>
        <td>${money(o.value)}</td>
        <td>${o.probability}%</td>
        <td>${esc(o.close)}</td>
        <td><button class="danger" onclick="deleteOpportunity(${o.id})">Delete</button></td>
      </tr>`).join("")}
    </table>`;
}

function renderActivities() {
  const query = (document.getElementById("activitySearch")?.value || "").toLowerCase();

  const rows = data.activities.filter(a =>
    Object.values(a).join(" ").toLowerCase().includes(query)
  );

  document.getElementById("activityTable").innerHTML = `
    <table>
      <tr><th>Date</th><th>Type</th><th>Subject</th><th>Account</th><th>Rep</th><th>Outcome</th><th></th></tr>
      ${rows.map(a=>`
      <tr>
        <td>${esc(a.date)}</td>
        <td>${badge(a.type)}</td>
        <td>${esc(a.subject)}</td>
        <td>${esc(a.account)}</td>
        <td>${esc(a.rep)}</td>
        <td>${badge(a.outcome)}</td>
        <td><button class="danger" onclick="deleteActivity(${a.id})">Delete</button></td>
      </tr>`).join("")}
    </table>`;
}

function renderAccounts() {
  document.getElementById("accountTable").innerHTML = `
    <table>
      <tr><th>Account</th><th>Region</th><th>Specialty</th><th>Owner</th><th>Priority</th><th>Status</th></tr>
      ${data.accounts.map(a=>`
      <tr>
        <td><strong>${esc(a.name)}</strong></td>
        <td>${esc(a.region)}</td>
        <td>${esc(a.specialty)}</td>
        <td>${esc(a.owner)}</td>
        <td>${badge(a.priority)}</td>
        <td>${badge(a.status)}</td>
      </tr>`).join("")}
    </table>`;
}

function openModal(title, html, submit) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalForm").innerHTML = html + `
    <div class="modal-actions">
      <button type="button" class="secondary" onclick="closeModal()">Cancel</button>
      <button class="primary">Save</button>
    </div>`;
  document.getElementById("modal").classList.add("show");
  document.getElementById("modalForm").onsubmit = e => {
    e.preventDefault();
    submit(new FormData(e.target));
    closeModal();
  };
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

function openOpportunityModal() {
  openModal("Add Opportunity", `
    <div class="form-grid">
      <label>Opportunity name<input name="name" required></label>
      <label>Account<input name="account" required></label>
      <label>Sales representative<input name="rep" required></label>
      <label>Region<input name="region" required></label>
      <label>Stage
        <select name="stage">
          <option>Lead</option><option>Qualified</option><option>Discovery</option>
          <option>Demo</option><option>Proposal</option><option>Closed Won</option><option>Closed Lost</option>
        </select>
      </label>
      <label>Value<input name="value" type="number" min="0" required></label>
      <label>Probability (%)<input name="probability" type="number" min="0" max="100" value="50"></label>
      <label>Created date<input name="created" type="date" required></label>
      <label>Qualified date<input name="qualified" type="date"></label>
      <label>Expected close date<input name="close" type="date" required></label>
    </div>
  `, form => {
    const o = Object.fromEntries(form.entries());
    o.id = Date.now();
    o.value = Number(o.value);
    o.probability = Number(o.probability);
    data.opportunities.push(o);
    save();
    setupFilters();
    renderOpportunities();
    renderDashboard();
  });
}

function openActivityModal() {
  openModal("Add Activity", `
    <div class="form-grid">
      <label>Date<input name="date" type="date" required></label>
      <label>Activity type
        <select name="type">
          <option>Call</option><option>Email</option><option>Meeting</option>
          <option>Discovery Call</option><option>Demo</option><option>Proposal Follow-up</option>
        </select>
      </label>
      <label class="full">Subject<input name="subject" required></label>
      <label>Account<input name="account" required></label>
      <label>Sales representative<input name="rep" required></label>
      <label class="full">Outcome
        <select name="outcome">
          <option>Positive</option>
          <option>Follow-up required</option>
          <option>Awaiting response</option>
          <option>Completed</option>
          <option>Not interested</option>
        </select>
      </label>
    </div>
  `, form => {
    const a = Object.fromEntries(form.entries());
    a.id = Date.now();
    data.activities.push(a);
    save();
    renderActivities();
    renderDashboard();
  });
}

function deleteOpportunity(id) {
  if (!confirm("Delete this opportunity?")) return;
  data.opportunities = data.opportunities.filter(o=>o.id!==id);
  save();
  renderOpportunities();
  renderDashboard();
}

function deleteActivity(id) {
  if (!confirm("Delete this activity?")) return;
  data.activities = data.activities.filter(a=>a.id!==id);
  save();
  renderActivities();
  renderDashboard();
}

function csv(rows) {
  if (!rows.length) return "";
  const headers = Object.keys(rows[0]);
  return [
    headers.join(","),
    ...rows.map(row => headers.map(h =>
      `"${String(row[h] ?? "").replace(/"/g,'""')}"`
    ).join(","))
  ].join("\n");
}

function download(filename, content) {
  const blob = new Blob([content], {type:"text/csv;charset=utf-8"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
  URL.revokeObjectURL(link.href);
}

function exportAll() {
  download("opportunities.csv", csv(data.opportunities));
  setTimeout(()=>download("activities.csv", csv(data.activities)),300);
  setTimeout(()=>download("accounts.csv", csv(data.accounts)),600);
}
