<script>
"use strict";

const STORAGE_KEY = "presales_tracking_data_v2";

const sampleData = {
  opportunities: [
    {
      id: 1,
      name: "Northstar Health Analytics",
      account: "Northstar Health",
      rep: "Aisha Khan",
      region: "North",
      stage: "Proposal",
      value: 125000,
      probability: 75,
      created: "2026-01-08",
      qualified: "2026-01-15",
      close: "2026-03-30",
      nextAction: "Send proposal"
    },
    {
      id: 2,
      name: "Acme Clinical Portal",
      account: "Acme Medical Group",
      rep: "Daniel Reed",
      region: "West",
      stage: "Demo",
      value: 85000,
      probability: 55,
      created: "2026-01-12",
      qualified: "2026-01-20",
      close: "2026-04-15",
      nextAction: "Demo follow-up"
    }
  ],
  activities: [
    {
      id: 1,
      date: "2026-03-01",
      type: "Discovery",
      subject: "Initial call",
      account: "Northstar Health",
      rep: "Aisha Khan",
      outcome: "Positive",
      nextAction: "Follow up"
    }
  ],
  tasks: [
    {
      id: 1,
      title: "Follow up proposal",
      account: "Northstar Health",
      opportunity: "Northstar Health Analytics",
      rep: "Aisha Khan",
      due: "2026-03-10",
      priority: "High",
      status: "Open",
      notes: "Review timeline"
    }
  ],
  accounts: [
    {
      id: 1,
      name: "Northstar Health",
      region: "North",
      specialty: "Healthcare",
      owner: "Aisha Khan",
      priority: "High",
      status: "Active",
      email: "",
      phone: ""
    }
  ]
};

/* Safely retrieve an element */
function getElement(id) {
  return document.getElementById(id);
}

/* Safely set an element's text */
function setText(id, value) {
  const element = getElement(id);
  if (element) element.textContent = value;
}

/* Safely set an element's HTML */
function setHTML(id, value) {
  const element = getElement(id);
  if (element) element.innerHTML = value;
}

/* Load saved data safely */
function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return structuredClone(sampleData);

    const parsed = JSON.parse(saved);

    return {
      opportunities: Array.isArray(parsed.opportunities)
        ? parsed.opportunities
        : [],
      activities: Array.isArray(parsed.activities)
        ? parsed.activities
        : [],
      tasks: Array.isArray(parsed.tasks)
        ? parsed.tasks
        : [],
      accounts: Array.isArray(parsed.accounts)
        ? parsed.accounts
        : []
    };
  } catch (error) {
    console.error("Could not load saved data:", error);
    return structuredClone(sampleData);
  }
}

let data = loadData();

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function money(value) {
  return new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: 0
  }).format(Number(value) || 0);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[character]));
}

function badge(value) {
  const text = String(value ?? "");
  const lower = text.toLowerCase();

  let color = "gray";

  if (
    ["closed won", "positive", "customer", "high", "completed", "open", "active"]
      .includes(lower)
  ) {
    color = "green";
  } else if (
    ["qualified", "demo", "medium"].includes(lower)
  ) {
    color = "blue";
  } else if (
    ["proposal", "discovery", "follow-up required", "prospect", "upcoming"]
      .includes(lower)
  ) {
    color = "orange";
  } else if (
    ["closed lost", "inactive", "low", "overdue"].includes(lower)
  ) {
    color = "red";
  }

  return `<span class="badge ${color}">${esc(text)}</span>`;
}

function todayString() {
  return new Date().toLocaleDateString(undefined, {
    year: "numeric",
    month: "short",
    day: "numeric"
  });
}

/* This no longer crashes if #today is missing */
function renderToday() {
  setText("today", todayString());
}

function showPage(pageId, button) {
  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  const selectedPage = getElement(pageId);
  if (selectedPage) selectedPage.classList.add("active");

  document.querySelectorAll(".sidebar button").forEach(item => {
    item.classList.remove("active");
  });

  if (button) button.classList.add("active");

  if (pageId === "dashboard") renderDashboard();
  if (pageId === "opportunities") renderOpportunities();
  if (pageId === "activities") renderActivities();
  if (pageId === "tasks") renderTasks();
  if (pageId === "accounts") renderAccounts();
}

function setupFilters() {
  const repSelect = getElement("dashboardRep");
  const regionSelect = getElement("dashboardRegion");

  if (!repSelect && !regionSelect) return;

  const currentRep = repSelect ? repSelect.value : "";
  const currentRegion = regionSelect ? regionSelect.value : "";

  const reps = [...new Set(
    data.opportunities.map(item => item.rep).filter(Boolean)
  )].sort();

  const regions = [...new Set(
    data.opportunities.map(item => item.region).filter(Boolean)
  )].sort();

  if (repSelect) {
    repSelect.innerHTML =
      `<option value="">All representatives</option>` +
      reps.map(rep =>
        `<option value="${esc(rep)}">${esc(rep)}</option>`
      ).join("");

    repSelect.value = reps.includes(currentRep) ? currentRep : "";
  }

  if (regionSelect) {
    regionSelect.innerHTML =
      `<option value="">All regions</option>` +
      regions.map(region =>
        `<option value="${esc(region)}">${esc(region)}</option>`
      ).join("");

    regionSelect.value = regions.includes(currentRegion)
      ? currentRegion
      : "";
  }
}

function getDashboardOpportunities() {
  const rep = getElement("dashboardRep")?.value || "";
  const region = getElement("dashboardRegion")?.value || "";
  const stage = getElement("dashboardStage")?.value || "";

  return data.opportunities.filter(opportunity => {
    return (
      (!rep || opportunity.rep === rep) &&
      (!region || opportunity.region === region) &&
      (!stage || opportunity.stage === stage)
    );
  });
}

function renderDashboard() {
  setupFilters();

  const opportunities = getDashboardOpportunities();

  const openOpportunities = opportunities.filter(opportunity =>
    !["Closed Won", "Closed Lost"].includes(opportunity.stage)
  );

  const won = opportunities.filter(
    opportunity => opportunity.stage === "Closed Won"
  );

  const lost = opportunities.filter(
    opportunity => opportunity.stage === "Closed Lost"
  );

  const completedDeals = won.length + lost.length;
  const winRate = completedDeals
    ? Math.round((won.length / completedDeals) * 100)
    : 0;

  setText(
    "kpiLeads",
    opportunities.filter(item => item.stage === "Lead").length
  );

  setText(
    "kpiQualified",
    opportunities.filter(item =>
      ["Qualified", "Discovery", "Demo", "Proposal"].includes(item.stage)
    ).length
  );

  setText(
    "kpiPipeline",
    money(openOpportunities.reduce(
      (total, item) => total + Number(item.value || 0),
      0
    ))
  );

  setText(
    "kpiWon",
    money(won.reduce(
      (total, item) => total + Number(item.value || 0),
      0
    ))
  );

  setText("kpiWinRate", `${winRate}%`);

  setText(
    "kpiActivities",
    data.activities.length
  );

  setText(
    "kpiOpenTasks",
    data.tasks.filter(task => task.status !== "Completed").length
  );

  setText(
    "kpiOverdueTasks",
    data.tasks.filter(task =>
      task.status !== "Completed" &&
      task.due &&
      new Date(task.due) < new Date()
    ).length
  );

  renderStageChart(opportunities);
  renderRepChart(opportunities);
  renderRecentActivities();
}

function renderStageChart(opportunities) {
  const container = getElement("stageChart");
  if (!container) return;

  const totals = {};

  opportunities.forEach(opportunity => {
    const stage = opportunity.stage || "Unspecified";
    totals[stage] = (totals[stage] || 0) + Number(opportunity.value || 0);
  });

  const values = Object.values(totals);
  const maximum = Math.max(...values, 1);

  const html = Object.entries(totals).map(([stage, value]) => `
    <div class="bar-row">
      <span>${esc(stage)}</span>
      <div class="bar">
        <span style="width:${(value / maximum) * 100}%"></span>
      </div>
      <strong>${money(value)}</strong>
    </div>
  `).join("");

  container.innerHTML = html || `<div class="empty">No pipeline data</div>`;
}

function renderRepChart(opportunities) {
  const container = getElement("repChart");
  if (!container) return;

  const totals = {};

  opportunities.forEach(opportunity => {
    const rep = opportunity.rep || "Unassigned";
    totals[rep] = (totals[rep] || 0) + Number(opportunity.value || 0);
  });

  const values = Object.values(totals);
  const maximum = Math.max(...values, 1);

  const html = Object.entries(totals).map(([rep, value]) => `
    <div class="bar-row">
      <span>${esc(rep)}</span>
      <div class="bar">
        <span style="width:${(value / maximum) * 100}%"></span>
      </div>
      <strong>${money(value)}</strong>
    </div>
  `).join("");

  container.innerHTML = html || `<div class="empty">No representative data</div>`;
}

function renderRecentActivities() {
  const container = getElement("recentActivities");
  if (!container) return;

  const rows = [...data.activities]
    .sort((a, b) => String(b.date).localeCompare(String(a.date)))
    .slice(0, 5);

  if (!rows.length) {
    container.innerHTML = `<div class="empty">No recent activities</div>`;
    return;
  }

  container.innerHTML = `
    <div class="table-wrap">
      <table>
        <tr>
          <th>Date</th>
          <th>Subject</th>
          <th>Representative</th>
          <th>Outcome</th>
        </tr>
        ${rows.map(activity => `
          <tr>
            <td>${esc(activity.date)}</td>
            <td>${esc(activity.subject)}</td>
            <td>${esc(activity.rep)}</td>
            <td>${badge(activity.outcome)}</td>
          </tr>
        `).join("")}
      </table>
    </div>
  `;
}

function renderOpportunities() {
  const container = getElement("opportunityTable");
  if (!container) return;

  const query = (
    getElement("opportunitySearch")?.value || ""
  ).toLowerCase();

  const rows = data.opportunities.filter(item =>
    Object.values(item).join(" ").toLowerCase().includes(query)
  );

  if (!rows.length) {
    container.innerHTML = `<div class="empty">No opportunities found</div>`;
    return;
  }

  container.innerHTML = `
    <div class="table-wrap">
      <table>
        <tr>
          <th>Name</th>
          <th>Account</th>
          <th>Stage</th>
          <th>Value</th>
        </tr>
        ${rows.map(item => `
          <tr>
            <td><strong>${esc(item.name)}</strong></td>
            <td>${esc(item.account)}</td>
            <td>${badge(item.stage)}</td>
            <td>${money(item.value)}</td>
          </tr>
        `).join("")}
      </table>
    </div>
  `;
}

function renderActivities() {
  const container = getElement("activityTable");
  if (!container) return;

  const query = (
    getElement("activitySearch")?.value || ""
  ).toLowerCase();

  const rows = data.activities.filter(item =>
    Object.values(item).join(" ").toLowerCase().includes(query)
  );

  if (!rows.length) {
    container.innerHTML = `<div class="empty">No activities found</div>`;
    return;
  }

  container.innerHTML = `
    <div class="table-wrap">
      <table>
        <tr>
          <th>Date</th>
          <th>Subject</th>
          <th>Outcome</th>
        </tr>
        ${rows.map(item => `
          <tr>
            <td>${esc(item.date)}</td>
            <td>${esc(item.subject)}</td>
            <td>${badge(item.outcome)}</td>
          </tr>
        `).join("")}
      </table>
    </div>
  `;
}

function renderTasks() {
  const container = getElement("taskTable");
  if (!container) return;

  const query = (
    getElement("taskSearch")?.value || ""
  ).toLowerCase();

  const filter = getElement("taskFilter")?.value || "";
  const now = new Date();

  const rows = data.tasks.filter(task => {
    const matchesSearch = Object.values(task)
      .join(" ")
      .toLowerCase()
      .includes(query);

    const overdue =
      task.status !== "Completed" &&
      task.due &&
      new Date(task.due) < now;

    const upcoming =
      task.status !== "Completed" &&
      task.due &&
      new Date(task.due) >= now;

    const matchesFilter =
      !filter ||
      (filter === "completed" && task.status === "Completed") ||
      (filter === "open" && task.status !== "Completed") ||
      (filter === "overdue" && overdue) ||
      (filter === "upcoming" && upcoming);

    return matchesSearch && matchesFilter;
  });

  if (!rows.length) {
    container.innerHTML = `<div class="empty">No tasks found</div>`;
    return;
  }

  container.innerHTML = `
    <div class="table-wrap">
      <table>
        <tr>
          <th>Task</th>
          <th>Due</th>
          <th>Status</th>
        </tr>
        ${rows.map(item => `
          <tr>
            <td>${esc(item.title)}</td>
            <td>${esc(item.due)}</td>
            <td>${badge(item.status)}</td>
          </tr>
        `).join("")}
      </table>
    </div>
  `;
}

function renderAccounts() {
  const container = getElement("accountTable");
  if (!container) return;

  const query = (
    getElement("accountSearch")?.value || ""
  ).toLowerCase();

  const rows = data.accounts.filter(item =>
    Object.values(item).join(" ").toLowerCase().includes(query)
  );

  if (!rows.length) {
    container.innerHTML = `<div class="empty">No accounts found</div>`;
    return;
  }

  container.innerHTML = `
    <div class="table-wrap">
      <table>
        <tr>
          <th>Name</th>
          <th>Owner</th>
          <th>Status</th>
        </tr>
        ${rows.map(item => `
          <tr>
            <td>${esc(item.name)}</td>
            <td>${esc(item.owner)}</td>
            <td>${badge(item.status)}</td>
          </tr>
        `).join("")}
      </table>
    </div>
  `;
}

function download(filename, content, type = "text/csv") {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();

  URL.revokeObjectURL(url);
}

function exportAll() {
  const header = "Name,Account,Representative,Region,Stage,Value\n";

  const rows = data.opportunities.map(item => [
    item.name,
    item.account,
    item.rep,
    item.region,
    item.stage,
    item.value
  ].map(value => `"${String(value ?? "").replace(/"/g, '""')}"`).join(","));

  download("opportunities.csv", header + rows.join("\n"));
}

function exportTasks() {
  const header = "Title,Account,Representative,Due,Priority,Status\n";

  const rows = data.tasks.map(item => [
    item.title,
    item.account,
    item.rep,
    item.due,
    item.priority,
    item.status
  ].map(value => `"${String(value ?? "").replace(/"/g, '""')}"`).join(","));

  download("tasks.csv", header + rows.join("\n"));
}

function backupData() {
  download(
    "sales-dashboard-backup.json",
    JSON.stringify(data, null, 2),
    "application/json"
  );
}

function importData(event) {
  const file = event.target.files?.[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function () {
    try {
      const imported = JSON.parse(reader.result);

      data = {
        opportunities: Array.isArray(imported.opportunities)
          ? imported.opportunities
          : [],
        activities: Array.isArray(imported.activities)
          ? imported.activities
          : [],
        tasks: Array.isArray(imported.tasks)
          ? imported.tasks
          : [],
        accounts: Array.isArray(imported.accounts)
          ? imported.accounts
          : []
      };

      save();
      location.reload();
    } catch (error) {
      alert("The selected file is not a valid dashboard backup.");
      console.error(error);
    }
  };

  reader.readAsText(file);
}

function resetData() {
  if (!confirm("Reset all dashboard data to the sample data?")) return;

  data = structuredClone(sampleData);
  save();
  location.reload();
}

/* Safe placeholder functions for buttons in the existing HTML */
function openOpportunityModal() {
  alert("Opportunity entry form is not available in this version.");
}

function openActivityModal() {
  alert("Activity entry form is not available in this version.");
}

function openTaskModal() {
  alert("Task entry form is not available in this version.");
}

function openAccountModal() {
  alert("Account entry form is not available in this version.");
}

function closeModal() {
  const modal = getElement("modal");
  if (modal) modal.classList.remove("show");
}

/* Start only after the HTML has loaded */
document.addEventListener("DOMContentLoaded", function () {
  renderToday();
  setupFilters();
  renderDashboard();
  renderOpportunities();
  renderActivities();
  renderTasks();
  renderAccounts();
});
</script>
