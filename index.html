function clone(value) {
  return JSON.parse(JSON.stringify(value));
}

function loadData() {
  const current = localStorage.getItem(STORAGE_KEY);
  const old = localStorage.getItem(OLD_STORAGE_KEY);

  let saved = current || old;

  if (!saved) return clone(sampleData);

  try {
    const parsed = JSON.parse(saved);

    parsed.opportunities = Array.isArray(parsed.opportunities)
      ? parsed.opportunities
      : [];

    parsed.activities = Array.isArray(parsed.activities)
      ? parsed.activities
      : [];

    parsed.accounts = Array.isArray(parsed.accounts)
      ? parsed.accounts
      : [];

    parsed.tasks = Array.isArray(parsed.tasks)
      ? parsed.tasks
      : [];

    parsed.opportunities.forEach(o => {
      if (!o.nextAction) o.nextAction = "";
    });

    parsed.activities.forEach(a => {
      if (!a.nextAction) a.nextAction = "";
    });

    return parsed;
  } catch {
    return clone(sampleData);
  }
}

function money(value) {
  return new Intl.NumberFormat("en-US", {
    style:"currency",
    currency:"USD",
    maximumFractionDigits:0
  }).format(Number(value) || 0);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[character]));
}

function badge(value) {
  const v = String(value || "").toLowerCase();
  let cls = "gray";

  if ([
    "closed won",
    "positive",
    "customer",
    "high",
    "completed",
    "open"
  ].includes(v)) cls = "green";

  else if ([
    "qualified",
    "demo",
    "active",
    "medium"
  ].includes(v)) cls = "blue";

  else if ([
    "proposal",
    "discovery call",
    "follow-up required",
    "prospect",
    "upcoming"
  ].includes(v)) cls = "orange";

  else if ([
    "closed lost",
    "inactive",
    "low",
    "overdue"
  ].includes(v)) cls = "red";

  return `<span class="badge ${cls}">${esc(value)}</span>`;
}

function showPage(id, button) {
  document.querySelectorAll(".page")
    .forEach(page => page.classList.remove("active"));

  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".sidebar button")
    .forEach(item => item.classList.remove("active"));

  if (button) button.classList.add("active");

  if (id === "dashboard") renderDashboard();
  if (id === "opportunities") renderOpportunities();
  if (id === "activities") renderActivities();
  if (id === "tasks") renderTasks();
  if (id === "accounts") renderAccounts();
}

function setupFilters() {
  const repSelect = document.getElementById("dashboardRep");
  const regionSelect = document.getElementById("dashboardRegion");

  const oldRep = repSelect.value;
  const oldRegion = regionSelect.value;

  const reps = [...new Set(
    data.opportunities.map(item => item.rep).filter(Boolean)
  )].sort();

  const regions = [...new Set(
    data.opportunities.map(item => item.region).filter(Boolean)
  )].sort();

  repSelect.innerHTML =
    `<option value="">All representatives</option>` +
    reps.map(rep =>
      `<option value="${esc(rep)}">${esc(rep)}</option>`
    ).join("");

  regionSelect.innerHTML =
    `<option value="">All regions</option>` +
    regions.map(region =>
      `<option value="${esc(region)}">${esc(region)}</option>`
    ).join("");

  if (reps.includes(oldRep)) repSelect.value = oldRep;
  if (regions.includes(oldRegion)) regionSelect.value = oldRegion;
}

function filteredOpportunities() {
  const rep = document.getElementById("dashboardRep").value;
  const region = document.getElementById("dashboardRegion").value;
  const stage = document.getElementById("dashboardStage").value;

  return data.opportunities.filter(item =>
    (!rep || item.rep === rep) &&
    (!region || item.region === region) &&
    (!stage || item.stage === stage)
  );
}

function taskState(task) {
  if (task.status === "Completed") return "completed";

  const today = new Date();
  today.setHours(0,0,0,0);

  const due = new Date(`${task.due}T00:00:00`);

  if (due < today) return "overdue";

  const nextSevenDays = new Date(today);
  nextSevenDays.setDate(nextSevenDays.getDate() + 7);

  if (due <= nextSevenDays) return "upcoming";

  return "open";
}

function renderDashboard() {
  setupFilters();

  const opportunities = filteredOpportunities();

  const open = opportunities.filter(item =>
    !["Closed Won","Closed Lost"].includes(item.stage)
  );

  const won = opportunities.filter(item =>
    item.stage === "Closed Won"
  );

  const lost = opportunities.filter(item =>
    item.stage === "Closed Lost"
  );

  const closedCount = won.length + lost.length;

  const selectedRep = document.getElementById("dashboardRep").value;
  const selectedRegion = document.getElementById("dashboardRegion").value;

  const activities = data.activities.filter(activity => {
    const account = data.accounts.find(
      item => item.name === activity.account
    );

    return (!selectedRep || activity.rep === selectedRep) &&
      (!selectedRegion || account?.region === selectedRegion);
  });

  const tasks = data.tasks.filter(task => {
    const account = data.accounts.find(
      item => item.name === task.account
    );

    return (!selectedRep || task.rep === selectedRep) &&
      (!selectedRegion || account?.region === selectedRegion);
  });

  document.getElementById("kpiLeads").textContent =
    opportunities.filter(item => item.stage === "Lead").length;

  document.getElementById("kpiQualified").textContent =
    opportunities.filter(item =>
      ["Qualified","Discovery","Demo","Proposal"].includes(item.stage)
    ).length;

  document.getElementById("kpiPipeline").textContent =
    money(open.reduce((sum,item) =>
      sum + Number(item.value || 0), 0
    ));

  document.getElementById("kpiWon").textContent =
    money(won.reduce((sum,item) =>
      sum + Number(item.value || 0), 0
    ));

  document.getElementById("kpiWinRate").textContent =
    closedCount
      ? Math.round(won.length / closedCount * 100) + "%"
      : "0%";

  document.getElementById("kpiActivities").textContent =
    activities.length;

  const openTasks = tasks.filter(task =>
    task.status !== "Completed"
  );

  document.getElementById("kpiOpenTasks").textContent =
    openTasks.length;

  document.getElementById("kpiOverdueTasks").textContent =
    openTasks.filter(task => taskState(task) === "overdue").length;

  renderStageChart(opportunities);
  renderRepChart(open);
  renderRecentActivities(selectedRep, selectedRegion);
}

function renderStageChart(opportunities) {
  const stages = [
    "Lead",
    "Qualified",
    "Discovery",
    "Demo",
    "Proposal",
    "Closed Won",
    "Closed Lost"
  ];

  const values = stages.map(stage =>
    opportunities
      .filter(item => item.stage === stage)
      .reduce((sum,item) =>
        sum + Number(item.value || 0), 0
      )
  );

  const max = Math.max(...values, 1);

  document.getElementById("stageChart").innerHTML =
    stages.map((stage,index) => `
      <div class="bar-row">
        <div>${stage}</div>
        <div class="bar">
          <span style="width:${values[index] / max * 100}%"></span>
        </div>
        <div>${money(values[index])}</div>
      </div>
    `).join("");
}

function renderRepChart(opportunities) {
  const reps = [...new Set(
    opportunities.map(item => item.rep).filter(Boolean)
  )].sort();

  const values = reps.map(rep =>
    opportunities
      .filter(item => item.rep === rep)
      .reduce((sum,item) =>
        sum + Number(item.value || 0), 0
      )
  );

  const max = Math.max(...values, 1);

  document.getElementById("repChart").innerHTML = reps.length
    ? reps.map((rep,index) => `
      <div class="bar-row">
        <div>${esc(rep)}</div>
        <div class="bar">
          <span style="width:${values[index] / max * 100}%"></span>
        </div>
        <div>${money(values[index])}</div>
      </div>
    `).join("")
    : `<div class="empty">No matching opportunities.</div>`;
}

      return (!rep || activity.rep === rep) &&
        (!region || account?.region === region);
    })
    .sort((a,b) => b.date.localeCompare(a.date))
    .slice(0,8);

  document.getElementById("recentActivities").innerHTML =
    rows.length
      ? `

}

function renderTasks() {
  const query = (
    document.getElementById("taskSearch")?.value || ""
  ).toLowerCase();

  const filter = document.getElementById("taskFilter")?.value || "";

  const rows = data.tasks
    .filter(task => !filter || taskState(task) === filter)
    .filter(task =>
      Object.values(task).join(" ").toLowerCase().includes(query)
    )
    .sort((a,b) => a.due.localeCompare(b.due));

  document.getElementById("taskTable").innerHTML =
    rows.length
      ? `
        <div class="table-wrap">
          <table>
            <tr>
              <th>Task</th>
              <th>Account</th>
              <th>Opportunity</th>
              <th>Rep</th>
              <th>Due Date</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
            ${rows.map(task => {
              const state = taskState(task);
              const dateClass =
                state === "overdue"
                  ? "overdue"
                  : state === "upcoming"
                    ? "due-soon"
                    : "";

              return `
                <tr class="${
                  task.status === "Completed"
                    ? "task-complete"
                    : ""
                }">
                  <td><strong>${esc(task.title)}</strong></td>
                  <td>${esc(task.account)}</td>
                  <td>${esc(task.opportunity)}</td>
                  <td>${esc(task.rep)}</td>
                  <td class="${dateClass}">${esc(task.due)}</td>
                  <td>${badge(task.priority)}</td>
                  <td>${badge(task.status)}</td>
                  <td>${esc(task.notes)}</td>
                  <td>
                    <div class="actions">
                      <button class="edit small"
                        onclick="toggleTask(${task.id})">
                        ${
                          task.status === "Completed"
                            ? "Reopen"
                            : "Complete"
                        }
                      </button>
                      <button class="edit small"
                        onclick="editTask(${task.id})">
                        Edit
                      </button>
                      <button class="danger small"
                        onclick="deleteTask(${task.id})">
                        Delete
                      </button>
                    </div>
                  </td>
                </tr>
              `;
            }).join("")}
          </table>
        </div>
      `
      : `<div class="empty">No tasks found.</div>`;
}

function openModal(title, html, submit) {
  document.getElementById("modalTitle").textContent = title;

  document.getElementById("modalForm").innerHTML = html + `
    <div class="modal-actions">
      <button type="button" class="secondary"
        onclick="closeModal()">
        Cancel
      </button>
      <button class="primary">Save</button>
    </div>
  `;

  document.getElementById("modal").classList.add("show");

  document.getElementById("modalForm").onsubmit = event => {
    event.preventDefault();
    submit(new FormData(event.target));
    closeModal();
  };
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").addEventListener("click", event => {
  if (event.target.id === "modal") closeModal();
});

function options(values, selected) {
  return values.map(value => `
    <option value="${esc(value)}"
      ${selected === value ? "selected" : ""}>
      ${esc(value)}
    </option>
  `).join("");
}

function csv(rows) {
  if (!rows.length) return "";

  const headers = Object.keys(rows[0]);

  return [
    headers.join(","),
    ...rows.map(row =>
      headers.map(header =>
        `"${String(row[header] ?? "").replace(/"/g, '""')}"`
      ).join(",")
    )
  ].join("\n");
}

function download(filename, content, type = "text/csv") {
  const blob = new Blob([content], {
    type: `${type};charset=utf-8`
  });

  const link = document.createElement("a");
  const url = URL.createObjectURL(blob);

  link.href = url;
  link.download = filename;
  link.click();

  setTimeout(() => URL.revokeObjectURL(url), 500);
}

function exportAll() {
  download("opportunities.csv", csv(data.opportunities));

  setTimeout(() => {

function backupData() {
  download(
    "presales-dashboard-backup.json",
    JSON.stringify(data, null, 2),
    "application/json"
  );
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);

      if (
        !Array.isArray(imported.opportunities) ||
        !Array.isArray(imported.activities) ||
        !Array.isArray(imported.accounts)
      ) {
        throw new Error("Invalid backup");
      }

      imported.tasks = Array.isArray(imported.tasks)
        ? imported.tasks
        : [];

      data = imported;
      save();

      setupFilters();
      renderDashboard();
      renderOpportunities();
      renderActivities();
      renderTasks();
      renderAccounts();

      alert("Backup imported successfully.");
    } catch {
      alert(
        "This is not a valid dashboard backup file."
      );
    }

    event.target.value = "";
  };

  reader.readAsText(file);
}
